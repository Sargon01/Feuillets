name: Release Plugin

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    name: Build, attest and release
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag and release metadata
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must be semantic versions, optionally prefixed with v: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          TAG="$TAG" node -e '
            const fs = require("node:fs");
            const tag = process.env.TAG;
            const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const versions = JSON.parse(fs.readFileSync("versions.json", "utf8"));
            if (packageJson.version !== tag || manifest.version !== tag) {
              throw new Error(`Tag ${tag} must match package.json and manifest.json versions.`);
            }
            if (versions[tag] !== manifest.minAppVersion) {
              throw new Error(`versions.json must map ${tag} to ${manifest.minAppVersion}.`);
            }
          '

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Type-check and lint
        run: npm run lint

      - name: Run Community lint
        run: npm run lint:obsidian

      - name: Test
        run: npm test

      - name: Build release assets
        run: npm run build

      - name: Verify release assets
        run: |
          test -f main.js
          test -f styles.css
          test -f manifest.json

      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" main.js styles.css manifest.json \
            --verify-tag \
            --title "Feuillets $GITHUB_REF_NAME" \
            --generate-notes
